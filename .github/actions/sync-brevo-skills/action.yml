name: Sync brevo-skills
description: >
  Tell getbrevo/brevo-skills to re-sync the brevo-cli agent skill from this repo.
  Its sync-skill workflow copies agent-context/SKILL.md at `ref` and opens a PR
  there for review, so nothing reaches users without a merge on that side.

inputs:
  token:
    description: >
      Token with `actions: write` on getbrevo/brevo-skills only (fine-grained
      token or GitHub App token). Pass BREVO_SKILLS_SYNC_TOKEN.
    required: true
  ref:
    description: Commit, branch or tag of this repo to sync from.
    required: true
  strict:
    description: >
      "true" fails the step when the token is missing; "false" only warns. The
      release path uses "false" (the publish is already done), the manual
      workflow uses "true" (someone asked for this run).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Dispatch sync-skill in getbrevo/brevo-skills
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN}" ]; then
          if [ "${STRICT}" = "true" ]; then
            echo "::error::BREVO_SKILLS_SYNC_TOKEN is not set for this environment."
            exit 1
          fi
          echo "::warning::BREVO_SKILLS_SYNC_TOKEN is not set; skipping the brevo-skills sync."
          exit 0
        fi
        echo "Dispatching brevo-skills sync for brevo-cli at ${REF}"
        gh workflow run sync-skill.yml \
          --repo getbrevo/brevo-skills \
          -f skill=brevo-cli \
          -f ref="${REF}"
