name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.15.0
          cache: yarn

      # `--ignore-scripts`: the only lifecycle script in the tree is husky's
      # `prepare`, which installs git hooks — nothing a CI job needs. Verified
      # against this lockfile: build, test and lint all work without them.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Test
        run: yarn test:ci

      - name: Build
        run: yarn build

      - name: Verify CLI runs
        run: node dist/bin/index.js --version
