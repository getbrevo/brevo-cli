name: Smoke (post-merge)

# Smokes the published package as soon as a release goes out, once npm serves
# the new version. Manual runs live on the `Smoke` workflow instead — pick
# `against: published` there; this workflow has no dispatch trigger of its own.
# Steps, timeout and concurrency all live in smoke.yml.
#
# Only reachable from a release created by a human or a PAT: Actions suppresses
# events generated by the default GITHUB_TOKEN, so the release changesets/action
# opens does NOT fire this. That path is covered by release.yaml dispatching
# `smoke.yml` directly — point it back here and it 422s, because a
# workflow_call-only workflow cannot be dispatched.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml
    with:
      against: published
      expected_version: ${{ github.event.release.tag_name }}
    secrets: inherit
