name: Smoke (post-merge)

# Smokes the published package as soon as a release goes out, once npm serves
# the new version. Manual runs live on the `Smoke` workflow instead — pick
# `against: published` there; this workflow has no dispatch trigger of its own.
# Steps, timeout and concurrency all live in smoke.yml.
#
# Only reachable from a release created by a human or a PAT — Actions suppresses
# events the default GITHUB_TOKEN generates, so the release changesets/action
# opens does not fire this. release.yaml dispatches `smoke.yml` for that path;
# pointing it back here 422s, since a workflow_call-only workflow can't be
# dispatched.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml
    with:
      against: published
      # Pinned for the same reason as the pre-merge lane.
      #
      # `private,ui` — the LIVE surface minus function, which runs on a
      # dedicated account (see smoke-function below). `ui` is not implied by
      # `private` (the two suites are disjoint). Both have shipped in every
      # build since their respective GA milestones.
      #
      # No 'public': those commands are eliminated from the published bundle, so
      # the steps could only ever skip — and smoke.yml now refuses that pairing
      # outright rather than skipping through it to a green run.
      suite: private,ui
      account: default
      expected_version: ${{ github.event.release.tag_name }}
    secrets: inherit

  smoke-function:
    uses: ./.github/workflows/smoke.yml
    with:
      against: published
      # Function commands need a dedicated account with dp-functions enabled.
      # Split into its own job so it authenticates with the function account
      # independently of the private/ui suites.
      suite: function
      account: function
      expected_version: ${{ github.event.release.tag_name }}
    secrets: inherit
