name: Smoke (pre-merge)

# Runs on the release path only:
#   - pull_request to main FROM `changeset-release/main` (publish gate)
#   - push to main (post-merge canary)
# Feature PRs are skipped via the job-level `if:` to save robot-account quota.
# To smoke a feature branch on demand, use the `Smoke` workflow's "Run workflow"
# button with `against: local` and the branch picked in "Use workflow from" —
# this workflow deliberately has no dispatch trigger of its own.
# The smoke itself is non-blocking (`non_blocking: true`): it runs on the
# release PR for visibility but a failure does not gate the merge.
# Steps, timeout and concurrency all live in smoke.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main')
    uses: ./.github/workflows/smoke.yml
    with:
      against: local
      # Pinned, not inherited. `suite`/`account` have defaults tuned for the
      # manual "Run workflow" button, and a release gate must not change what it
      # covers because someone retuned a dropdown.
      #
      # `private,public,ui,init` — everything except function, which runs on a
      # dedicated account (see smoke-function below). This is the widest lane
      # on purpose (minus function), and it is the right place to be widest: it
      # is `non_blocking`, so a suite that has never run headless can prove
      # itself here without gating a merge, and it runs on every push to main —
      # which always precedes a release, so the post-merge lane inherits proven
      # ground. Selecting 'public' makes the runner build PREVIEW=1, unchanged
      # from when this lane ran `private,public`; the published surface is
      # covered by the post-merge lane, which installs from npm.
      suite: private,public,ui,init
      account: default
      non_blocking: true
    secrets: inherit

  smoke-function:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main')
    uses: ./.github/workflows/smoke.yml
    with:
      against: local
      # Function commands need a dedicated account with dp-functions enabled.
      suite: function
      account: function
      non_blocking: true
    secrets: inherit
