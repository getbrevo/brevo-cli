name: Smoke (pre-merge)

# Runs on the release path only:
#   - pull_request to main FROM `changeset-release/main` (publish gate)
#   - push to main (post-merge canary)
# Feature PRs are skipped via the job-level `if:` to save robot-account quota.
# To smoke a feature branch on demand, use the `Smoke` workflow's "Run workflow"
# button with `against: local` and the branch picked in "Use workflow from" —
# this workflow deliberately has no dispatch trigger of its own.
# The smoke itself is non-blocking (`non_blocking: true`): it runs on the
# release PR for visibility but a failure does not gate the merge.
# Steps, timeout and concurrency all live in smoke.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main')
    uses: ./.github/workflows/smoke.yml
    with:
      against: local
      non_blocking: true
    secrets: inherit
