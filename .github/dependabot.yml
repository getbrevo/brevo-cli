version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # changesets/action v2 requires @changesets/cli v3; this repo is on v2.
      # Re-enable together with a @changesets/cli v3 upgrade.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
